name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same hooks that guard a local commit: file hygiene, formatting and
  # clippy. Running them here keeps a bypassed hook from slipping through.
  hooks:
    name: Git hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: j178/prek-action@v3

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-features

      # The example configuration ships with the packages, so it must stay valid.
      - name: Validate the example configuration
        run: cargo run --release -- --config assets/example-config.yaml check

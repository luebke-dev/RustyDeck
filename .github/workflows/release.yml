name: Release

# Releases use calendar versioning: YEAR.MONTH.MINOR (for example 2026.8.0),
# where MINOR counts the releases within that month. Tag as v2026.8.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    name: Binary and packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # Everything is pure Rust, so musl links statically without any C
      # toolchain. The packages carry that same binary, which keeps them free
      # of a glibc floor.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/rustydeck target/release/rustydeck

      - name: Package the tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="rustydeck-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp target/release/rustydeck "dist/${name}/"
          cp README.md LICENSE assets/MDI-LICENSE assets/example-config.yaml "dist/${name}/"
          cp -r packaging "dist/${name}/packaging"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Build the deb and rpm packages
        run: |
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/

      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish the release
    needs: [artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

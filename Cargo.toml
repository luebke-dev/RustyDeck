[package]
name = "rustydeck"
# Calendar versioning: YEAR.MONTH.MINOR, where MINOR counts the releases
# within that month.
version = "2026.8.0"
edition = "2024"
rust-version = "1.88"
description = "A Stream Deck service driven by a YAML file, with built-in Material Design Icons"
authors = ["luebke-dev"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/luebke-dev/RustyDeck"
homepage = "https://github.com/luebke-dev/RustyDeck"
keywords = ["streamdeck", "elgato", "hid", "daemon", "yaml"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["/.github", "/packaging"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
libc = "0.2.189"
log = "0.4.34"
minijinja = "2.24.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[profile.release]
# Smaller binaries for the release artefacts; the icon font is already 1.3 MB.
lto = "thin"
strip = "symbols"

# --- Debian package (cargo deb) ---------------------------------------------
[package.metadata.deb]
maintainer = "luebke-dev <luebke@b1-systems.de>"
copyright = "2026, luebke-dev"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
RustyDeck drives an Elgato Stream Deck from a YAML file. Keys are described \
with icons, labels and colours, and can follow the state of the system. \
7448 Material Design Icons are built into the binary."""
assets = [
    ["target/release/rustydeck", "usr/bin/", "755"],
    ["packaging/rustydeck.service", "usr/lib/systemd/user/rustydeck.service", "644"],
    ["packaging/70-streamdeck.rules", "usr/lib/udev/rules.d/70-streamdeck.rules", "644"],
    ["README.md", "usr/share/doc/rustydeck/README.md", "644"],
    ["assets/example-config.yaml", "usr/share/doc/rustydeck/example-config.yaml", "644"],
    ["assets/MDI-LICENSE", "usr/share/doc/rustydeck/MDI-LICENSE", "644"],
]

# --- Fedora/RHEL package (cargo generate-rpm) -------------------------------
[package.metadata.generate-rpm]
summary = "A Stream Deck service driven by a YAML file"
assets = [
    { source = "target/release/rustydeck", dest = "/usr/bin/rustydeck", mode = "755" },
    { source = "packaging/rustydeck.service", dest = "/usr/lib/systemd/user/rustydeck.service", mode = "644" },
    { source = "packaging/70-streamdeck.rules", dest = "/usr/lib/udev/rules.d/70-streamdeck.rules", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rustydeck/README.md", mode = "644", doc = true },
    { source = "assets/example-config.yaml", dest = "/usr/share/doc/rustydeck/example-config.yaml", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/rustydeck/LICENSE", mode = "644", doc = true },
    { source = "assets/MDI-LICENSE", dest = "/usr/share/licenses/rustydeck/MDI-LICENSE", mode = "644", doc = true },
]
